function qty(id,change){

 item.qty=nextQty;saveCart();renderCart();
}

async function authAction(){
 if(!db){say("authMsg","Supabase connection is not initialized. Check project URL and API key.",true);return;}

 const email=document.getElementById("authEmail").value.trim().toLowerCase();
 const password=document.getElementById("authPassword").value;

 if(!email||password.length<6){
  say("authMsg","Enter a valid email and password of at least 6 characters.",true);return;
 }
 if(authMode==="admin"&&!ADMIN_EMAILS.includes(email)){
  say("authMsg","Admin Login is only for approved admin email addresses.",true);return;
 }

 const button=document.getElementById("authAction");
 button.disabled=true;button.textContent="Please wait...";

 try{
  if(authMode==="signup"){
   const result=await db.auth.signUp({
    email,password,
    options:{emailRedirectTo:location.origin+location.pathname}
   });
   if(result.error)say("authMsg",result.error.message,true);
   else say("authMsg","Account created. Check your email for verification, then login.");
   return;
  }

  const result=await db.auth.signInWithPassword({email,password});
  if(result.error){say("authMsg",result.error.message,true);return;}

  await refreshAuth();

  if(authMode==="admin"&&role!=="admin"){
   await db.auth.signOut();await refreshAuth();
   say("authMsg","This account does not have the admin role in Supabase profiles.",true);
   return;
  }
  location.hash=role==="admin"?"#admin":"#my-orders";
 }catch(e){
  say("authMsg",friendlyError(e),true);
 }finally{
  button.disabled=false;
  button.textContent=authMode==="signup"?"Create Account":"Login";
 }
}

async function placeOrder(){
 if(!db||!user){say("checkoutMsg","Please login first.",true);return;}
 if(!cart.length){say("checkoutMsg","Your cart is empty.",true);return;}

 const name=document.getElementById("customerName").value.trim();
 const email=document.getElementById("customerEmail").value.trim().toLowerCase();
 const phone=document.getElementById("customerPhone").value.trim();
 const requirements=document.getElementById("requirements").value.trim();
 const file=document.getElementById("receiptFile").files[0];

 if(!name||!email||!phone||!requirements||!file){
  say("checkoutMsg","Please fill your name, email, phone, requirements and upload receipt.",true);return;
 }
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
  say("checkoutMsg","Please enter a valid email address.",true);return;
 }
 if(file.size>5*1024*1024){
  say("checkoutMsg","Receipt must be 5 MB or smaller.",true);return;
 }
 if(!["image/jpeg","image/png","image/webp","application/pdf"].includes(file.type)){
  say("checkoutMsg","Please upload JPG, PNG, WEBP or PDF.",true);return;
 }

 const btn=document.getElementById("submitOrderBtn");
 btn.disabled=true;btn.textContent="Submitting...";

 let uploadedPath=null;

 try{
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=user.id+"/"+crypto.randomUUID()+"."+ext;

  const up=await db.storage.from(BUCKET).upload(path,file,{
   upsert:false,contentType:file.type
  });
  if(up.error)throw up.error;
  uploadedPath=path;

  const payload={
   customer_id:user.id,
   customer_email:email,
   customer_name:name,
   phone:phone,
   business_name:document.getElementById("businessName").value.trim(),
   requirements,
   items:cart.map(x=>({
    id:x.id,name:x.name,unit_price:x.price,
    quantity:x.qty,description:x.description
   })),
   total:total(),
   payment_method:document.getElementById("paymentMethod").value,
   payment_status:"Receipt submitted",
   status:"New",
   receipt_path:path
  };

  const ins=await db.from("studio_orders").insert(payload).select().single();
  if(ins.error)throw ins.error;

  cart=[];saveCart();renderCart();
  document.getElementById("receiptFile").value="";
  document.getElementById("customerName").value="";
  document.getElementById("customerPhone").value="";
  document.getElementById("businessName").value="";
  document.getElementById("requirements").value="";
  document.getElementById("checkoutMsg").innerHTML="";
  document.getElementById("orderSuccessNotice").classList.remove("hidden");

 say("checkoutMsg","Order submitted successfully! Your order ID is "+ins.data.id+".");
navigate("my-orders");

 }catch(e){
  if(uploadedPath)await db.storage.from(BUCKET).remove([uploadedPath]);
  say("checkoutMsg","Could not submit order: "+friendlyError(e),true);
 }finally{
  btn.disabled=false;btn.textContent="Submit Order";
 }
}

 ];

 const buttons=[
  {name:"All",count:data.length},

  }))
 ];

 let html=`
  <div style="margin:20px 0">
   <h2 class="gold">Orders Management</h2>

   <div class="actions" style="margin:20px 0">

     </button>

 `;

 el.innerHTML=html;

 adminOrderFilter=status;

async function deleteOrder(id){
 if(!db||!user||role!=="admin"){
  alert("Admin access required.");
  return;
 }

 if(!confirm("Are you sure you want to permanently delete this order?"))return;

 const order=adminOrdersCache.find(o=>String(o.id)===String(id));

 const {data,error}=await db.from("studio_orders")
  .delete()
  .eq("id",id)
  .select("id");

 if(error){
  alert("Delete failed: "+error.message);
  return;
 }

 if(!data || data.length===0){
  alert("Order delete nahi hua! Supabase DELETE permission check karo.");
  return;
 }

 if(order?.receipt_path){
  const {error:storageError}=await db.storage.from(BUCKET).remove([order.receipt_path]);

  if(storageError){
   alert("Order delete ho gaya, lekin receipt file delete nahi hui: "+storageError.message);
  }
 }

 alert("Order deleted successfully!");
 await loadAdminOrders();
}

async function updateOrder(id){
 if(!db||!user||role!=="admin")return;
 const statusEl=document.getElementById("st-"+id);
 const paymentEl=document.getElementById("ps-"+id);
 if(!statusEl||!paymentEl){alert("Order controls not found. Refresh orders and try again.");return;}

 const {error}=await db.from("studio_orders")
  .update({status:statusEl.value,payment_status:paymentEl.value})
  .eq("id",id);

 if(error){alert("Update failed: "+error.message);return;}
 alert("Order updated successfully.");
 await loadAdminOrders();
}
